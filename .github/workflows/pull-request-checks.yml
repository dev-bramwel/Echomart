name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      
      - name: Set CI environment
        run: |
          echo "SECRET_KEY=ci-test-secret-key-not-for-production" >> "$GITHUB_ENV"
          echo "DEBUG=False" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: pip install -r requirements.txt black ruff

      - name: Check Python formatting
        run: black --check .

      - name: Check Python lint
        run: ruff check .

      - name: Run Django checks
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting and lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deployment:
    name: Deployment checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up example environment
        shell: bash
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Build frontend image
        run: docker compose build frontend

      - name: Build database image
        run: docker compose build db
